<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Ashutosh Raval</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" style="padding:16px;">
    <a href="index.html" class="brand">Ashutosh Raval</a>
    <nav><a href="index.html">Home</a> <a href="projects/index.html">Projects</a></nav>
  </header>
  <main class="container" style="padding:20px;">
    <h1>Contact</h1>
    <p>Demo contact page. In production, this would submit to a CRM or mailer.</p>
    <form>
      <div>
        <label>Name</label>
        <input type="text" placeholder="Your name" />
      </div>
      <div>
        <label>Email</label>
        <input type="email" placeholder="Your email" />
      </div>
      <div>
        <label>Message</label>
        <textarea placeholder="Your message"></textarea>
      </div>
      <button type="submit">Send</button>
    </form>
  </main>
  <footer class="site-footer">© 2026 Ashutosh Raval</footer>
</body>
</html>
